<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>上传图纸标尺寸一图片标尺寸 @网上用户</title>
<meta name="keywords" content="网上用户,图片标尺寸,尺寸标注,零件图">
<meta name="description" content="在图片上随意标注尺寸、写字、涂鸦，截图后发送给客户 @网上用户">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#fff;}
body{overflow:hidden;}

/* 背景图片层：默认留空，上传后显示 */
#bgImg{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  z-index:0;
  max-width:92vw;
  max-height:84vh;
  width:auto;
  height:auto;
  display:none;
  user-select:none;
  -webkit-user-drag:none;
  object-fit:contain;
}

/* 顶部工具栏：最多两行，居中 */
.tool-bar{
  position:fixed;
  top:8px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  justify-content:center;
  z-index:999;
  background:rgba(30,30,30,0.75);
  padding:6px 8px;
  border-radius:14px;
  align-items:center;
  max-width:calc(100% - 12px);
}
.tool-btn{
  width:26px;
  height:26px;
  border-radius:50%;
  cursor:pointer;
  border:1px solid #fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:bold;
  user-select:none;
  color:#000;
  line-height:1;
  background:#eee;
}
.color-circle{
  width:20px;
  height:20px;
  border-radius:50%;
  cursor:pointer;
  border:1px solid #fff;
}
.write-btn{ background:#0b0; color:#fff; }
.draw-btn{ background:#08f; color:#fff; }
.paint-btn{ background:#fff; color:#000; border:1px solid #888; }
.eraser-btn{ background:#ddd; color:#000; }
.clear-btn{ background:#f44; color:#fff; }
.upload-btn{ background:#f90; color:#fff; }
.paste-btn{ background:#0aa; color:#fff; }
.size-btn{ background:#78c; color:#fff; font-size:12px; }
.active{ box-shadow:0 0 0 2px #ff0; }

/* 手写画布 */
#drawCanvas{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  z-index:1;
  touch-action:none;
}
/* 涂改液预览层：透明，只显示当次要画的直线，松手后才叠到主画布 */
#previewCanvas{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  z-index:1;
  pointer-events:none;
  touch-action:none;
}

/* 文字输入层 */
.text-item{
  position:absolute;
  background:transparent;
  border:none;
  font-size:24px;
  font-weight:bold;
  outline:none;
  font-family:unset;
  color:#00f;
  z-index:2;
  cursor:move;
  white-space:pre-wrap;
  word-break:break-all;
  max-width:calc(100vw - 16px);
}
</style>
</head>
<body>

<img id="bgImg" alt="">
<input type="file" id="fileInput" accept="image/*" style="display:none">

<div class="tool-bar">
  <div class="tool-btn write-btn" id="writeBtn">字</div>
  <div class="tool-btn draw-btn" id="drawBtn">手</div>
  <div class="tool-btn paint-btn" id="paintBtn">涂</div>
  <div class="color-circle" style="background:#000" data-color="#000"></div>
  <div class="color-circle" style="background:#fff" data-color="#fff"></div>
  <div class="color-circle" style="background:#ff0" data-color="#ff0"></div>
  <div class="color-circle" style="background:#00f" data-color="#00f"></div>
  <div class="color-circle" style="background:#f00" data-color="#f00"></div>
  <div class="color-circle" style="background:#0f0" data-color="#0f0"></div>
  <div class="tool-btn eraser-btn" id="eraserBtn">擦</div>
  <div class="tool-btn clear-btn" id="clearBtn">清</div>
  <span style="width:1px;height:20px;background:#fff;opacity:.4"></span>
  <div class="tool-btn upload-btn" id="uploadBtn">传</div>
  <div class="tool-btn paste-btn" id="pasteBtn" title="粘贴剪贴板里的图纸（微信右键复制后点这里，或直接 Ctrl+V）">粘</div>
  <div class="tool-btn size-btn" id="imgDown">图-</div>
  <div class="tool-btn size-btn" id="imgUp">图+</div>
  <div class="tool-btn size-btn" id="fontDown">字-</div>
  <div class="tool-btn size-btn" id="fontUp">字+</div>
</div>

<canvas id="drawCanvas"></canvas>
<canvas id="previewCanvas"></canvas>

<script>
let currentColor = "#00f";
let mode;
let fontSize = 24;
let imgW = 460; // 图片基准宽度
const storageKey = "bbText_6";
const fontKey = "bbFont_6";

// 判断设备：手机触屏默认手写draw；电脑非触屏默认打字write
function isMobileTouch(){
  return ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
}
if(isMobileTouch()){
  mode = "draw";
}else{
  mode = "write";
}

/* ========== 画布 ========== */
const canvas = document.getElementById("drawCanvas");
const ctx = canvas.getContext("2d");
const previewCanvas = document.getElementById("previewCanvas");
const previewCtx = previewCanvas.getContext("2d");
const bgImg = document.getElementById("bgImg");
const fileInput = document.getElementById("fileInput");
let drawing = false;
let lastX = 0, lastY = 0;

// 获取坐标：核心修复，把屏幕client坐标转为canvas内部坐标
function getCanvasPos(e){
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top) * scaleY
  }
}

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  previewCanvas.width = canvas.width;
  previewCanvas.height = canvas.height;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

/* ========== 图片大小 ========== */
function applyImgSize(){
  bgImg.style.width = imgW + "px";
}
function initImgSize(){
  imgW = Math.min(window.innerWidth - 40, 460);
  applyImgSize();
}

/* ========== 上传电脑本地图片（不传入网站文件夹） ========== */
const uploadBtn = document.getElementById("uploadBtn");
uploadBtn.addEventListener("click", function(){
  fileInput.click();
});

/* 统一入口：把一张图片显示为底图（只在内存里读取，不上传到网站目录） */
function showImage(src){
  bgImg.src = src;
  bgImg.style.display = "block";
  initImgSize();
}
function showImageFromBlob(blob){
  if(!blob) return;
  const reader = new FileReader();
  reader.onload = function(e){ showImage(e.target.result); };
  reader.readAsDataURL(blob);
}

fileInput.addEventListener("change", function(){
  const file = this.files[0];
  if(!file) return;
  showImageFromBlob(file);
  fileInput.value = "";
});

/* ========== 粘贴图纸（微信里右键复制 → 回到这里 Ctrl+V） ========== */
const pasteBtn = document.getElementById("pasteBtn");

// 1) 页面任意位置按 Ctrl+V / Command+V 直接粘贴图片当作底图
document.addEventListener("paste", function(e){
  // 正在某段文字里打字时，不抢它的粘贴
  const ac = document.activeElement;
  if(ac && ac.classList && ac.classList.contains("text-item")) return;

  const cd = e.clipboardData;
  if(!cd || !cd.items) return;
  for(let i = 0; i < cd.items.length; i++){
    const it = cd.items[i];
    if(it.kind === "file" && it.type && it.type.indexOf("image") === 0){
      const blob = it.getAsFile();
      if(!blob) continue;
      e.preventDefault();
      showImageFromBlob(blob);
      return;
    }
  }
});

// 2) 点“粘”按钮：尝试直接读剪贴板
pasteBtn.addEventListener("click", function(){
  if(!(navigator.clipboard && navigator.clipboard.read)){
    alert("这个环境不允许按钮直接读剪贴板。\n\n请用键盘粘贴：Windows 按 Ctrl+V，Mac 按 Command+V。\n（先在微信里对图纸右键→复制）");
    return;
  }
  navigator.clipboard.read().then(function(items){
    for(let i = 0; i < items.length; i++){
      const types = items[i].types || [];
      const imgType = types.filter(function(t){ return t.indexOf("image") === 0; })[0];
      if(imgType){
        items[i].getType(imgType).then(function(blob){
          showImageFromBlob(blob);
        });
        return;
      }
    }
    alert("剪贴板里没找到图片。\n请先在微信里对图纸右键→复制，再点“粘”。");
  }).catch(function(){
    alert("浏览器没给读取剪贴板的权限。\n\n请改用键盘粘贴：Windows 按 Ctrl+V，Mac 按 Command+V。");
  });
});

/* ========== 字体大小 ========== */
function applyFontSize(){
  document.querySelectorAll(".text-item").forEach(d=>{
    d.style.fontSize = fontSize + "px";
  });
}
function saveFont(){
  try{ localStorage.setItem(fontKey, String(fontSize)); }catch(e){}
}
const savedFont = localStorage.getItem(fontKey);
if(savedFont) fontSize = parseInt(savedFont) || 24;
applyFontSize();

/* ========== 涂改液 / 画笔 ========== */
function getStroke(){
  if(mode === "paint"){           // 白色涂改液：加粗白色实心笔
    return { color:"#ffffff", width:20 };
  }
  return { color: currentColor, width: 6 };
}

/* 涂改液/橡皮擦直线相关状态 */
let lineStart = null;     // 起笔点
let paintMoved = false;   // 涂改液是否拖动了
let eraseMoved = false;   // 橡皮擦是否拖动了
let lastEnd = null;       // 橡皮擦上一次吸附终点
let eraseSize = 20;       // 橡皮擦宽度（像素）
let curErase = false;     // 当前是否在直线擦除中（橡皮擦拖动）
let eraserSnap = false;   // 是否强制横竖吸附（擦按钮模式为 true）
let eraseAnchor = null;   // Ctrl/Alt 两点擦的第一点（PS 钢笔式锚点）

// 两点之间擦一条直线（任意角度）
function eraseLine(a, b){
  ctx.save();
  ctx.globalCompositeOperation = "destination-out";
  ctx.beginPath();
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = "rgba(0,0,0,1)";
  ctx.lineWidth = eraseSize;
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.stroke();
  ctx.restore();
}
// 在预览层画两点连线（红色半透明提示）
function previewLine(a, b){
  previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
  previewCtx.beginPath();
  previewCtx.lineCap = "round";
  previewCtx.lineJoin = "round";
  previewCtx.strokeStyle = "rgba(255,0,0,0.45)";
  previewCtx.lineWidth = eraseSize;
  previewCtx.moveTo(a.x, a.y);
  previewCtx.lineTo(b.x, b.y);
  previewCtx.stroke();
}
// 在预览层画锚点小圆点
function drawAnchorDot(p){
  previewCtx.beginPath();
  previewCtx.fillStyle = "rgba(0,0,255,0.8)";
  previewCtx.arc(p.x, p.y, 4, 0, Math.PI*2);
  previewCtx.fill();
}
// 按当前工具执行"两点连直线"（Ctrl/Alt 点对点）
function pointLine(a, b){
  if(mode === "eraser"){
    eraseLine(a, b);                       // 擦模式：擦一条直线
  }else if(mode === "paint"){
    // 涂模式：画一条白色直线
    const s = getStroke();
    ctx.beginPath();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = s.color;
    ctx.lineWidth = s.width;
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }else if(mode === "draw"){
    // 手模式：画一条当前颜色的直线
    ctx.beginPath();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = currentColor;
    ctx.lineWidth = 6;
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }
}

function startDraw(e){
  const p = getCanvasPos(e);
  drawing = true;
  lastX = p.x;
  lastY = p.y;
}
function moveDraw(e){
  if(!drawing) return;
  const p = getCanvasPos(e);
  const s = getStroke();
  ctx.beginPath();
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = s.color;
  ctx.lineWidth = s.width;
  ctx.moveTo(lastX, lastY);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
  lastX = p.x;
  lastY = p.y;
}
function endDraw(){
  if(curErase && lineStart){
    if(eraseMoved){
      // 直线擦除：用 destination-out 把一条直条擦成透明（露出下面的原图）
      ctx.save();
      ctx.globalCompositeOperation = "destination-out";
      ctx.beginPath();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "rgba(0,0,0,1)";
      ctx.lineWidth = eraseSize;
      ctx.moveTo(lineStart.x, lineStart.y);
      ctx.lineTo(lastEnd ? lastEnd.x : lineStart.x, lastEnd ? lastEnd.y : lineStart.y);
      ctx.stroke();
      ctx.restore();
    }else{
      // 单击没拖动：擦掉一个方块
      ctx.clearRect(lineStart.x - eraseSize/2, lineStart.y - eraseSize/2, eraseSize, eraseSize);
    }
    previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
    curErase = false;
    drawing = false;
    lineStart = null;
    lastEnd = null;
    return;
  }
  if(mode === "paint" && lineStart){
    if(!paintMoved){                  // 单击没拖动：主画布盖一个白色圆点
      const s = getStroke();
      ctx.beginPath();
      ctx.fillStyle = s.color;
      ctx.arc(lineStart.x, lineStart.y, s.width/2, 0, Math.PI*2);
      ctx.fill();
    }else{                            // 拖动了：把预览直线叠到主画布，绝不擦除已有内容
      ctx.drawImage(previewCanvas, 0, 0);
    }
    previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
  }
  drawing = false;
  lineStart = null;
  lastEnd = null;
}

/* ========== PointerEvents ========== */
function enableDrawEvents(){
  canvas.style.pointerEvents = "auto";
  canvas.addEventListener("pointerdown", onPointerDown);
  canvas.addEventListener("pointermove", onPointerMove);
  canvas.addEventListener("pointerup", endDraw);
  canvas.addEventListener("pointercancel", endDraw);
}
function disableDrawEvents(){
  canvas.style.pointerEvents = "none";
  canvas.removeEventListener("pointerdown", onPointerDown);
  canvas.removeEventListener("pointermove", onPointerMove);
  canvas.removeEventListener("pointerup", endDraw);
  canvas.removeEventListener("pointercancel", endDraw);
}

function onPointerDown(e){
  const modErase = (e.ctrlKey || e.altKey);   // 按住 Ctrl 或 Alt = 钢笔式两点擦
  if(modErase){
    // PS 钢笔式：点一下设起点，再点另一点，按当前工具连真实直线（涂=白线，擦=擦除，手=彩色线）
    e.preventDefault();
    const p = getCanvasPos(e);
    if(eraseAnchor){
      previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
      pointLine(eraseAnchor, p);   // 两点连直线
      eraseAnchor = null;
    }else{
      eraseAnchor = p;             // 记下第一点
      previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
      drawAnchorDot(p);
    }
    return;
  }
  if(mode === "eraser"){
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    // 擦按钮模式：按住拖动，横竖直线擦除
    lineStart = getCanvasPos(e);
    eraseMoved = false;
    curErase = true;
    eraserSnap = true;
    drawing = true;
    previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
    return;
  }
  if(mode !== "draw" && mode !== "paint") return;
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  drawing = true;
  if(mode === "paint"){
    const p = getCanvasPos(e);
    lineStart = { x:p.x, y:p.y };
    paintMoved = false;
    previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
  }else{
    startDraw(e);
  }
}
function onPointerMove(e){
  if(!drawing) return;
  e.preventDefault();
  if(curErase && lineStart){
    const p = getCanvasPos(e);
    let end;
    if(eraserSnap){
      // 横竖吸附：横着拖擦水平，竖着拖擦竖直
      end = (Math.abs(p.x-lineStart.x) >= Math.abs(p.y-lineStart.y))
        ? { x:p.x, y:lineStart.y }
        : { x:lineStart.x, y:p.y };
    }else{
      // 任意角度：两点连真实直线（可擦斜线）
      end = { x:p.x, y:p.y };
    }
    if(Math.abs(p.x-lineStart.x) > 2 || Math.abs(p.y-lineStart.y) > 2) eraseMoved = true;
    lastEnd = end;
    // 在预览层用半透明红色显示要擦的直条，松手时才真正擦除
    previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
    previewCtx.beginPath();
    previewCtx.lineCap = "round";
    previewCtx.lineJoin = "round";
    previewCtx.strokeStyle = "rgba(255,0,0,0.45)";
    previewCtx.lineWidth = eraseSize;
    previewCtx.moveTo(lineStart.x, lineStart.y);
    previewCtx.lineTo(end.x, end.y);
    previewCtx.stroke();
    return;
  }
  if(mode === "paint" && lineStart){
    const p = getCanvasPos(e);
    const s = getStroke();
    // 吸附：横着拖变水平线，竖着拖变垂直线
    const end = (Math.abs(p.x-lineStart.x) >= Math.abs(p.y-lineStart.y))
      ? { x:p.x, y:lineStart.y }
      : { x:lineStart.x, y:p.y };
    if(Math.abs(p.x-lineStart.x) > 2 || Math.abs(p.y-lineStart.y) > 2) paintMoved = true;
    // 只在预览层重画，不碰主画布 → 重复涂往上叠加，像真涂改液多涂几遍
    previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
    previewCtx.beginPath();
    previewCtx.lineCap = "round";
    previewCtx.lineJoin = "round";
    previewCtx.strokeStyle = s.color;
    previewCtx.lineWidth = s.width;
    previewCtx.moveTo(lineStart.x, lineStart.y);
    previewCtx.lineTo(end.x, end.y);
    previewCtx.stroke();
    return;
  }
  if(mode === "draw"){
    moveDraw(e);
  }
}

/* ========== 文字系统 ========== */
function saveData(){
  const list = [];
  document.querySelectorAll(".text-item").forEach(div=>{
    list.push({
      x: parseFloat(div.style.left),
      y: parseFloat(div.style.top),
      color: div.style.color,
      fontSize: parseFloat(div.style.fontSize) || 24,
      text: div.innerText
    });
  });
  localStorage.setItem(storageKey, JSON.stringify(list));
}

/* 让文字可以用鼠标拖动位置 */
function makeDraggable(div){
  let startX=0,startY=0,startLeft=0,startTop=0,drag=false,moved=false;
  div.addEventListener("pointerdown", function(e){
    if(mode!=="write") return;
    startX=e.clientX; startY=e.clientY;
    startLeft=parseFloat(div.style.left)||0;
    startTop=parseFloat(div.style.top)||0;
    drag=true; moved=false;
    div.contentEditable=false;            // 拖动时先禁止编辑，防止选中文字
    div.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  div.addEventListener("pointermove", function(e){
    if(!drag) return;
    let dx=e.clientX-startX, dy=e.clientY-startY;
    if(Math.abs(dx)>3||Math.abs(dy)>3) moved=true;
    div.style.left=(startLeft+dx)+"px";
    div.style.top=(startTop+dy)+"px";
  });
  function endDrag(e){
    if(!drag) return;
    drag=false;
    div.contentEditable=true;
    if(moved){ saveData(); }else{ div.focus(); }
  }
  div.addEventListener("pointerup", endDrag);
  div.addEventListener("pointercancel", endDrag);
}

function loadData(){
  const raw = localStorage.getItem(storageKey);
  if(!raw) return;
  const list = JSON.parse(raw);
  list.forEach(item=>{
    if(!item.text) return;
    if(item.x > window.innerWidth - 20) item.x = window.innerWidth - 20;
    let div = document.createElement("div");
    div.className = "text-item";
    div.contentEditable = true;
    div.style.left = item.x + "px";
    div.style.top = item.y + "px";
    div.style.color = item.color;
    div.style.fontSize = (item.fontSize || 24) + "px";
    div.innerText = item.text;
    document.body.appendChild(div);
    makeDraggable(div);
    div.addEventListener("input", saveData);
    div.addEventListener("blur", function(){
      if(this.innerText.trim() === "") this.remove();
      saveData();
    });
  });
}
loadData();

/* ========== 工具栏切换 ========== */
const writeBtn = document.getElementById("writeBtn");
const drawBtn = document.getElementById("drawBtn");
const paintBtn = document.getElementById("paintBtn");
const eraserBtn = document.getElementById("eraserBtn");
const clearBtn = document.getElementById("clearBtn");

function setMode(newMode){
  mode = newMode;
  writeBtn.classList.remove("active");
  drawBtn.classList.remove("active");
  paintBtn.classList.remove("active");
  eraserBtn.classList.remove("active");
  // 切换工具时清掉预览层残留和两点锚点
  eraseAnchor = null;
  previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);

  if(mode === "write"){
    writeBtn.classList.add("active");
    disableDrawEvents();
  }
  if(mode === "draw"){
    drawBtn.classList.add("active");
    enableDrawEvents();
  }
  if(mode === "paint"){
    paintBtn.classList.add("active");
    enableDrawEvents();
  }
  if(mode === "eraser"){
    eraserBtn.classList.add("active");
    enableDrawEvents();   // 橡皮擦也要支持拖拽画直线
  }
}
setMode(mode);

writeBtn.addEventListener("click", ()=>setMode("write"));
drawBtn.addEventListener("click", ()=>setMode("draw"));
paintBtn.addEventListener("click", function(){
  if(mode === "paint"){
    setMode(isMobileTouch() ? "draw" : "write");
  }else{
    setMode("paint");
  }
});

/* 颜色切换 */
document.querySelectorAll(".color-circle").forEach(el=>{
  el.addEventListener("click", function(){
    currentColor = this.dataset.color;
  });
});

/* 图片大小按钮 */
document.getElementById("imgUp").addEventListener("click", function(){
  imgW = Math.min(imgW * 1.12, window.innerWidth * 0.92);
  applyImgSize();
});
document.getElementById("imgDown").addEventListener("click", function(){
  imgW = Math.max(imgW * 0.9, 80);
  applyImgSize();
});

/* 字体大小按钮 */
document.getElementById("fontUp").addEventListener("click", function(){
  fontSize = Math.min(fontSize + 2, 72);
  applyFontSize();
  saveFont();
});
document.getElementById("fontDown").addEventListener("click", function(){
  fontSize = Math.max(fontSize - 2, 12);
  applyFontSize();
  saveFont();
});

/* 橡皮擦 */
eraserBtn.addEventListener("click", function(){
  if(mode === "eraser"){
    setMode(isMobileTouch() ? "draw" : "write");
  }else{
    setMode("eraser");
  }
});

document.body.addEventListener("click", function(e){
  if(mode !== "eraser") return;
  if(e.target.classList.contains("tool-btn") || e.target.classList.contains("color-circle")) return;
  document.querySelectorAll(".text-item").forEach(item=>{
    const r = item.getBoundingClientRect();
    const expand = 20;
    if(
      e.clientX >= r.left - expand &&
      e.clientX <= r.right + expand &&
      e.clientY >= r.top - expand &&
      e.clientY <= r.bottom + expand
    ){
      item.remove();
      saveData();
    }
  });
});

/* 清屏按钮 */
clearBtn.onclick = function(){
  document.querySelectorAll(".text-item").forEach(item=>item.remove());
  localStorage.removeItem(storageKey);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
};

/* 文字点击输入 */
document.body.addEventListener("click", function(e){
  if(mode !== "write") return;
  if(e.target.classList.contains("text-item") || e.target.classList.contains("tool-btn") || e.target.classList.contains("color-circle")) return;

  let clickX = e.clientX;
  const maxLeft = window.innerWidth - 20;
  if(clickX > maxLeft) clickX = maxLeft;

  let div = document.createElement("div");
  div.className = "text-item";
  div.contentEditable = true;
  div.style.left = clickX + "px";
  div.style.top = e.clientY + "px";
  div.style.color = currentColor;
  div.style.fontSize = fontSize + "px";
  document.body.appendChild(div);
  makeDraggable(div);
  div.focus();

  div.addEventListener("input", saveData);
  div.addEventListener("blur", function(){
    if(this.innerText.trim() === "") this.remove();
    saveData();
  });
});

/* 按住 Ctrl/Alt 时：实时预览"第一点到光标"的擦除连线 */
document.addEventListener("pointermove", function(e){
  if(!eraseAnchor) return;
  if(!(e.ctrlKey || e.altKey)){
    previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
    return;
  }
  const p = getCanvasPos(e);
  previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
  drawAnchorDot(eraseAnchor);
  previewLine(eraseAnchor, p);
});
</script>
