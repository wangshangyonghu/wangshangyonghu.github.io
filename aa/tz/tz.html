a.card .no{display:block;font-size:12px;color:#aaa;font-weight:normal;margin-top:8px}
.foot{text-align:center;color:#aaa;font-size:12px;margin-top:26px}
@media (max-width:480px){.wrap{padding:18px 12px 50px}h1{font-size:19px}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
