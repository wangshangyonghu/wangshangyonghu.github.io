<script>
// 等页面DOM完全加载完毕再执行
document.addEventListener('DOMContentLoaded', function(){
  document.querySelectorAll('a').forEach(a=>{
    const href = a.getAttribute('href');
    // 过滤锚点链接不新开
    if(!href.startsWith('#') && !href.startsWith('javascript:')){
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
    }
  });
})
</script>
