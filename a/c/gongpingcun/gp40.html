公元二零二五年张公爷庆典活动

五华县双华镇公平村纪念张公法青仁爷630周年华诞庆典活动.
尊敬的各位父老乡亲、社会各界人士、女士们、先生们:
您们好！首先祝您们生意兴隆、财源广进，丁财兴旺，合家平安！
光阴似箭、转眼、农历八月十三日张公法青仁爷千秋华诞，依照惯例，今年别无异样。对此、年度理事会、正精心组织、策划、筹助庆典活动资金。正逢寿庆，迎接国庆中秋佳节。望各乡贤回乡参加庆典，迎国庆过中秋。特望各位知名人士、老板、善男信女、共同关心、支持、协助、慷慨解囊。
您们的乐捐赞助、必有福报。法青公定会庇佑您们财源广进、生意兴隆、心想事成、福禄寿全、丁财兴旺、福中添福。谢谢！
