<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网上用户PP棉过滤器分享</title>
    <meta name="keywords" content="网上用户PP棉过滤器分享,pp棉过滤器,pp棉滤芯,10寸pp棉滤芯,净水器滤芯,前置过滤棉,净水过滤芯" />
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .search-wrapper {
            max-width: 700px;
            margin: 20px auto;
        }
        .search-form {
            display: flex;
            height: 44px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .search-input {
            flex: 1;
            padding: 0 15px;
            border: 1px solid #ff4400;
            border-right: none;
            outline: none;
            font-size: 14px;
            border-radius: 4px 0 0 4px;
            box-sizing: border-box;
        }
        .search-btn {
            min-width: 80px;
            background-color: #ff4400;
            color: white;
            border: none;
            font-size: 16px;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .search-btn:hover {
            background-color: #f53f00;
        }
        .keyword-category {
            margin: 25px 0;
        }
        .category-title {
            font-size: 18px;
            color: #333;
            margin-bottom: 12px;
            font-weight: 600;
            border-left: 3px solid #ff4400;
            padding-left: 8px;
        }
        .keyword-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .keyword-btn {
            padding: 6px 14px;
            background-color: #fff;
            border: 1px solid #ff4400;
            color: #ff4400;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s;
        }
        .keyword-btn:hover {
            background-color: #ff4400;
            color: #fff;
        }
        .btn-container {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 10px 12px;
            padding: 10px;
            box-sizing: border-box;
        }
        .app-btn {
            display: inline-block;
            background-color: #e6f7ff;
            color: #1890ff;
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .app-btn:hover {
            background-color: #bae7ff;
            color: #096dd9;
        }
    </style>
</head>
<body>
    <!-- 搜索框区域 -->
    <div class="search-wrapper">
        <form class="search-form" id="searchForm">
            <input type="search" class="search-input" name="q" placeholder="请输入搜索关键词（如：10寸PP棉过滤器滤芯）" required>
            <button type="submit" class="search-btn">搜索</button>
        </form>
    </div>
    <!-- 店铺按钮容器 -->
    <div class="btn-container">
        <a href="/" target="_blank" class="app-btn"></a>
    </div>
    <!-- PP棉过滤器关键词区域 -->
    <div style="max-width: 700px; margin: 0 auto;">
        <div id="linkContainer"></div>
    </div>
    <script>
        // 统一设备判断
        function isMobileDevice() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        }
        // 顶部搜索跳转链接
        const urls = {
            // mobileApp 手机端唤起淘宝APP链接
            mobileApp: "taobao://ai.m.taobao.com/search.html?&pid=mm_5518923388_3058500304_116069600003&union_lens=lensId%3APUB%401781582035%402103e876_1697_19ece907902_04ff%4001&q=",
            // mobileWeb 手机浏览器网页链接
            mobileWeb: "https://ai.m.taobao.com/search.html?&pid=mm_5518923388_3058500304_116069600003&union_lens=lensId%3APUB%401781582035%402103e876_1697_19ece907902_04ff%4001&q=",
            // pcWeb 电脑PC端网页链接
            pcWeb: "https://ai.taobao.com/search/index.htm?&pid=mm_5518923388_3058500304_116069600003&union_lens=lensId%3APUB%401781581630%400b11d4cc_15e6_19ece8a4d26_050d%4001&key="
        };
        // 关键词跳转链接
        const linksConfig = {
            // mobileBase 关键词跳转-手机唤起淘宝APP链接
            mobileBase: "taobao://ai.m.taobao.com/search.html?&pid=mm_5518923388_3058500304_116069600003&union_lens=lensId%3APUB%401781582035%402103e876_1697_19ece907902_04ff%4001&q=",
            // pcBase 关键词跳转-电脑PC端网页链接
            pcBase: "https://ai.taobao.com/search/index.htm?&pid=mm_5518923388_3058500304_116069600003&union_lens=lensId%3APUB%401781581630%400b11d4cc_15e6_19ece8a4d26_050d%4001&key="
        };
        // PP棉过滤器相关关键词（50个）
        const categoryKeywords = {
            "PP棉过滤净水配件": [
                "pp棉过滤器", "pp棉滤芯", "10寸pp棉滤芯", "5微米pp棉", "1微米pp棉滤芯",
                "前置过滤器滤芯", "净水器pp棉", "熔喷pp棉滤芯", "家用净水pp棉", "自来水过滤pp棉",
                "20寸pp棉滤芯", "大流量pp棉", "工业pp棉过滤器", "保安过滤器滤芯", "纯水机第一级滤芯",
                "pp棉滤芯套装", "pp棉滤芯批发", "整包pp棉滤芯", "全屋前置pp棉", "农村井水过滤滤芯",
                "泥沙过滤pp棉", "铁锈过滤滤芯", "水垢前置过滤棉", "管道过滤器pp棉", "滤瓶pp棉滤芯",
                "透明滤瓶pp棉", "净水器通用pp棉", "各品牌通用滤芯", "高密度pp棉", "加厚pp棉滤芯",
                "压纹pp棉滤芯", "带骨架pp棉", "无骨架pp棉滤芯", "5寸pp棉滤芯", "30寸pp棉过滤器",
                "净水器配件pp棉", "过滤棉滤芯耗材", "自来水粗滤滤芯", "地下水过滤器滤芯", "洗车水过滤pp棉",
                "鱼池过滤pp棉", "工业水过滤滤芯", "pp棉过滤器外壳", "前置滤瓶套装", "家用管道过滤器",
                "pp棉更换滤芯", "长效pp棉滤芯", "耐高压pp棉", "高精度pp棉滤芯", "净水耗材pp棉"
            ]
        };
        // 生成关键词按钮
        function generateLinks() {
            const container = document.getElementById("linkContainer");
            if (!container) return;
            const baseUrl = isMobileDevice() ? linksConfig.mobileBase : linksConfig.pcBase;
            Object.entries(categoryKeywords).forEach(([category, keywords]) => {
                const categoryDiv = document.createElement("div");
                categoryDiv.className = "keyword-category";
                const titleElement = document.createElement("div");
                titleElement.className = "category-title";
                titleElement.textContent = category;
                categoryDiv.appendChild(titleElement);
                const buttonsDiv = document.createElement("div");
                buttonsDiv.className = "keyword-buttons";
                const uniqueKeywords = [...new Set(keywords)].filter(k => k.trim());
                uniqueKeywords.forEach(keyword => {
                    const link = document.createElement("a");
                    link.href = baseUrl + encodeURIComponent(keyword);
                    link.target = "_blank";
                    link.textContent = keyword;
                    link.className = "keyword-btn";
                    buttonsDiv.appendChild(link);
                });
                categoryDiv.appendChild(buttonsDiv);
                container.appendChild(categoryDiv);
            });
        }
        window.addEventListener('load', function() {
            // 搜索框聚焦
            const searchInput = document.querySelector('.search-input');
            if (searchInput) searchInput.focus();
            // 渲染关键词
            generateLinks();
            // 搜索表单提交事件
            const searchForm = document.getElementById('searchForm');
            searchForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const inputValue = searchInput.value.trim();
                if (!inputValue) {
                    alert('请输入搜索关键词');
                    return;
                }
                const encodedKeyword = encodeURIComponent(inputValue);
                const isMobile = isMobileDevice();
                if (isMobile) {
                    const iframe = document.createElement('iframe');
                    iframe.style.display = 'none';
                    iframe.src = urls.mobileApp + encodedKeyword;
                    document.body.appendChild(iframe);
                    setTimeout(() => {
                        document.body.removeChild(iframe);
                        window.location.href = urls.mobileWeb + encodedKeyword;
                    }, 300);
                } else {
                    window.location.href = urls.pcWeb + encodedKeyword;
                }
            });
            // 店铺链接自动切换淘宝APP协议
            document.querySelectorAll('.app-btn').forEach(link => {
                if (isMobileDevice()) {
                    link.href = link.href.replace('https://', 'taobao://');
                }
            });
        });
    </script>
    <!-- 外部样式与脚本 -->
    <link rel="stylesheet" href="/a/js/bj.css">
    <link rel="stylesheet" href="/a/js/xhx.css">
    <link rel="stylesheet" href="/a/js/h.css">
    <script src="/a/js/ico.js"></script>
</body>
</html>
