<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

 <title>网上用户的图片</title>
    <meta name="keywords" content="网上用户的图片,搜索:网上用户,网上用户,上网用户,用户,公平村" /><!--关键词-->
     <!-- 可选：网页描述（用于搜索引擎结果展示） -- 
<meta name="description" content="网上用户的图片" />

  <!-- CSS样式定义部分 -->
    <style type="text/css">
      /* 为所有的a标签设置样式 */
      a {
        text-decoration: none; /* 去除a标签的下划线 */
        font-weight: bold; /* 为a标签设置粗体样式 */
        font-size: 18px; /* 为a标签设置字体大小为18像素 */
      }
    </style>


    <!-- 可选：可以添加样式美化下载链接和图片 -->
    <style>
        .download-container {
            text-align: center;
            margin: 20px auto;
            max-width: 400px;
        }
        .download-link {
            display: inline-block;
        }
        #gpcjpg {
            border: 1px solid #eee;
            border-radius: 4px;
            padding: 5px;
        }
    </style>
</head>

<body>
    <div class="download-container">
<h1>网上用户的图片</h1>
<!--图片-->
<div>
    <a href="" class="download-link" download="网上用户.jpg">
        <img id="gpcjpg" src="" width="330" title="点击下载图片" alt="@网上用户">
    </a>
</div>
<script>
    // 获取当前页面完整url
    var currentUrl = window.location.href;
    // 匹配 url里 数字.html 取出id数字
    var match = currentUrl.match(/(\d+)\.html/);

    if (match) {
        var number = match[1];
        // 修改图片路径为 /tu/jpg1/
        var imgPath = '/tu/jpg1/' + number + '.jpg';

        var img = document.getElementById('gpcjpg');
        var link = document.querySelector('.download-link');

        if (img) {
            img.src = imgPath;
            // 图片加载失败回调
            img.onerror = function () {
                this.alt = '网上用户图片加载失败';
                this.src = '';
            }
        }
        if (link) {
            link.href = imgPath;
            // 下载文件名：下载的时候保存为 网上用户_123.jpg
            link.download = "网上用户_" + number + ".jpg";
        }
    } else {
        var img = document.getElementById('gpcjpg');
        if (img) {
            img.alt = '网上用户的图片ID';
        }
    }
</script>
<!--图片-->
