        function mobile_device_detect(url) {
            var thisOS = navigator.platform;
            var os = new Array("iPhone", "iPod", "iPad", "android", "Nokia", "SymbianOS", "Symbian", "Windows Phone", "Phone", "Linux armv71", "MAUI", "UNTRUSTED/1.0", "Windows CE", "BlackBerry", "IEMobile");
            for (var i = 0; i < os.length; i++) {
                if (thisOS.match(os[i])) {
                    window.location = url;
                }
            }
            if (navigator.platform.indexOf('iPad') != -1) {
                window.location = url;
            }
            var check = navigator.appVersion;
            if (check.match(/linux/i)) {
                if (check.match(/mobile/i) || check.match(/X11/i)) {
                    window.location = url;
                }
            }
        }
        mobile_device_detect("e2.html");

        <script>
            // ====================== 实时日期时钟 ======================
            function updateDateTime() {
                const now = new Date();
                const year = now.getFullYear();
                const month = now.getMonth() + 1;
                const day = now.getDate();
                const hours = now.getHours().toString().padStart(2, '0');
                const minutes = now.getMinutes().toString().padStart(2, '0');
                const seconds = now.getSeconds().toString().padStart(2, '0');
                const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
                const dayOfWeek = days[now.getDay()];
                if (document.getElementById('dateTime')) {
                    document.getElementById('dateTime').innerHTML = 
                        `${year}年${month}月${day}日 ${hours}:${minutes}:${seconds} ${dayOfWeek}`;
                }
            }
            updateDateTime();
            // 每秒刷新一次时间
            setInterval(updateDateTime, 1000);

            // ====================== 数字转人民币大写工具 ======================
            const chineseNumber = ["零", "壹", "贰", "叁", "肆", "伍", "陆", "柒", "捌", "玖"];
            const chineseUnit = ["", "拾", "佰", "仟", "万", "拾", "佰", "仟", "亿", "拾", "佰", "仟"];
            /**
             * 数字转换人民币大写（支持元角分）
             * @param {number} num 待转换数字
             * @returns {string} 大写金额
             */
            function convertToChinese(num) {
                if (!num || isNaN(num)) return "零元整";
                let number = parseFloat(num);
                if (number === 0) return "零元整";
                // 拆分整数与小数（角、分）
                let integerPart = Math.floor(number);
                let decimalPart = Math.round((number - integerPart) * 100);
                let jiao = Math.floor(decimalPart / 10);
                let fen = decimalPart % 10;

                let integerStr = integerPart.toString();
                let result = "";
                let zeroFlag = false;
                let unitIndex = integerStr.length - 1;

                for (let i = 0; i < integerStr.length; i++) {
                    let digit = parseInt(integerStr[i]);
                    if (digit === 0) {
                        zeroFlag = true;
                    } else {
                        if (zeroFlag) {
                            result += "零";
                            zeroFlag = false;
                        }
                        result += chineseNumber[digit] + chineseUnit[unitIndex - i];
                    }
                }
                if (result) {
                    result += "元";
                } else {
                    result = "零元";
                }
                // 角
                if (jiao > 0) {
                    result += chineseNumber[jiao] + "角";
                } else if (jiao === 0 && fen > 0 && integerPart > 0) {
                    result += "零";
                }
                // 分
                if (fen > 0) {
                    result += chineseNumber[fen] + "分";
                } else if (jiao === 0 && fen === 0) {
                    result += "整";
                }
                result = result.replace(/^零元零/, '零');
                result = result.replace(/^零元/, '');
                return result || "零元整";
            }

            // ====================== 百分号预处理 40% → 0.4 ======================
            function processPercentage(expr) {
                return expr.replace(/(\d+(\.\d+)?)%/g, (match, num) => {
                    return (parseFloat(num) / 100).toString();
                });
            }

            // ====================== 安全数学表达式计算 ======================
            function calculateExpression(expr) {
                // 只允许数字、四则符号、括号、空格、百分号，防止恶意代码
                const validPattern = /^[\d+\-*/.()\s%]+$/;
                if (!validPattern.test(expr)) {
                    return null;
                }
                try {
                    const processedExpr = processPercentage(expr);
                    const func = new Function(`return ${processedExpr};`);
                    const result = func();
                    if (isNaN(result) || !isFinite(result)) {
                        return null;
                    }
                    return result;
                } catch (e) {
                    return null;
                }
            }

            // ====================== 键盘抬起监听：计算/大写转换 /回车搜索 ======================
            function handleKeyUp(event) {
                const inputValue = document.getElementById("searchInput").value.trim();
                const resultElement = document.getElementById("result");
                resultElement.innerHTML = "";
                if (inputValue === "") {
                    return;
                }
                // 判断是否为纯数字表达式或纯数字，做中文大写转换 / 数学计算
                const calculationResult = calculateExpression(inputValue);
                if (calculationResult !== null && !isNaN(calculationResult)) {
                    const formattedExpr = inputValue.replace(/\s+/g, '');
                    const displayResult = Number.isInteger(calculationResult) 
                        ? calculationResult 
                        : parseFloat(calculationResult.toFixed(6));
                    let resultHtml = `<div style="color: #0066cc; font-weight: bold;">${formattedExpr} = ${displayResult}</div>`;
                    const chineseResult = convertToChinese(displayResult);
                    resultHtml += `<div style="color: #e67e22; margin-top: 5px;">${displayResult} = ${chineseResult}</div>`;
                    resultElement.innerHTML = resultHtml;
                } 
                else if (!isNaN(inputValue.replace(/%/g, '')) && inputValue !== "") {
                    let numValue = inputValue;
                    if (numValue.includes('%')) {
                        numValue = processPercentage(numValue);
                    }
                    const num = parseFloat(numValue);
                    if (!isNaN(num)) {
                        const chineseResult = convertToChinese(num);
                        resultElement.innerHTML = `<div style="color: #e67e22; font-weight:bold;">${num} = ${chineseResult}</div>`;
                    }
                }
                // 按下回车键执行搜索
                if(event.keyCode === 13){
                    startSearch();
                }
            }

            //======================搜索引擎跳转函数========================
            function startSearch(){
                let keyword = document.getElementById("searchInput").value.trim();
                if(!keyword){
                    alert("请输入搜索关键词");
                    return;
                }
                window.open("https://cn.bing.com/search?q="+encodeURIComponent(keyword));
            }
            document.getElementById("mainSearchBtn").onclick = startSearch;

            //多引擎按钮点击事件
            document.querySelectorAll('.link-btn[data-engine]').forEach(btn=>{
                btn.onclick = function(){
                    let keyword = document.getElementById("searchInput").value.trim();
                    let engine = this.dataset.engine;
                    let url;
                    switch(engine){
                        case 'baidu': url='https://www.baidu.com/s?wd=';break;
                        case 'bing': url='https://cn.bing.com/search?q=';break;
                        case 'toutiao': url='https://so.toutiao.com/search?keyword=';break;
                        case 'weixin': url='https://weixin.sogou.com/weixin?query=';break;
                        case '360': url='https://www.so.com/s?q=';break;
                        case 'douyin': url='https://www.douyin.com/search/';break;
                        case 'sogou': url='https://www.sogou.com/web?query=';break;
                        case 'yandex': url='https://yandex.com/search/?text=';break;
                        case '3dsource': url='https://www.3dsource.cn/search.html?keyword=';break;
                        case 'baidu-mp3': url='https://music.baidu.com/search?key=';break;
                        case 'baidu-video': url='https://v.baidu.com/v?wd=';break;
                        case 'baidu-news': url='https://news.baidu.com/ns?word=';break;
                        case 'taobao': url='https://ai.taobao.com/search/index.htm?keyword=';break;
                        case 'bing-quote': url='https://cn.bing.com/search?q="';break;
                        case 'bing-image': url='https://cn.bing.com/images/search?q=';break;
                        case 'baidu-image': url='https://image.baidu.com/search/index?tn=baiduimage&word=';break;
                        case 'sogou-image': url='https://pic.sogou.com/pics?query=';break;
                        case '360-image': url='https://image.so.com/i?q=';break;
                        case 'taobao-image': url='https://s.taobao.com/search?q=';break;
                        case 'atb': url='https://ai.taobao.com/search/index.htm?keyword=';break;
                        case 'tb': url='https://s.taobao.com/search?q=';break;
                        case 'yp': url='https://youpin.mi.com/search?keyword=';break;
                        case 'dd': url='https://search.dangdang.com/?key=';break;
                        case 'baidu-trans': url='https://fanyi.baidu.com/#auto/zh/';break;
                        case 'sogou-trans': url='https://fanyi.sogou.com/text?text=';break;
                        case 'bing-trans': url='https://cn.bing.com/translator?text=';break;
                        default: url='https://cn.bing.com/search?q=';
                    }
                    if(engine==='bing-quote'){
                        window.open(url+encodeURIComponent(keyword)+'"');
                    }else if(engine==='douyin'){
                        window.open(url+'?keyword='+encodeURIComponent(keyword));
                    }else{
                        window.open(url+encodeURIComponent(keyword));
                    }
                }
            })
        </script>
