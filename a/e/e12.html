<style>
:root {
    --primary-color: #0066FF;
    --text-color: #333;
    --border-color: #ccc;
    --btn-hover: #0055DD;
}

body {
    color: var(--text-color);
    padding: 20px 15px;
}

.container {
    margin: 0 auto;
}

.category-title {
    display: inline-block;
    background: linear-gradient(to bottom, var(--primary-color), #0099ff);
    color: #fff;
    font-size: 12px;
    font-weight: bold;
    padding: 1px 10px;
    border-radius: 8px;
    margin-bottom: 8px;
}

.link-container {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    padding: 15px;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    background-color: #f9f9f9;
    margin-bottom: 25px;
    counter-reset: seq;
}

.link-container > a {
    display: inline-flex;
    align-items: center;
    padding: 8px 15px;
    background-color: #CCFFFF;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    color: var(--primary-color);
    text-decoration: none;
    font-size: 20px;
    font-weight: 500;
}

.link-container > a:hover {
    background-color: var(--primary-color);
    color: #fff;
    border-color: var(--primary-color);
}


</style>


</head>
