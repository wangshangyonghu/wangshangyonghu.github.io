<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网上用户的友情链接</title>

    <!-- 图标 -->
    <link rel="icon" href="ico.jpg" type="image/x-icon">
    <link rel="shortcut icon" href="ico.jpg" type="image/x-icon"/>
    <link rel="apple-touch-icon" href="ico.jpg"/>
    <link rel="apple-touch-startup-image" href="ico.jpg"/>
    <link rel="icon" sizes="192x192" href="ico.jpg"/>
    <link rel="icon" sizes="any" mask href="ico.jpg"/>
    <link rel="apple-touch-icon-precomposed" href="ico.jpg">

       <!-- ========== 搜索框样式（单独一块，可删） ========== -->
    <style>
        .search-tip {
            color: #666;
            font-size: 13px;
            margin-bottom: 12px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.5;
        }

        .search-wrap {
            display: flex;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 0 10px;
        }

        .search-wrap input {
            flex: 1;
            padding: 14px 16px;
            font-size: 17px;
            border: 3px solid #0058ff;
            border-radius: 12px 0 0 12px;
            border-right: none;
            outline: none;
        }

        .search-wrap button {
            padding: 14px 20px;
            font-size: 17px;
            background-color: #0058ff;
            color: white;
            border: 3px solid #0058ff;
            border-radius: 0 12px 12px 0;
            cursor: pointer;
            border-left: 0;
            white-space: nowrap;
        }
    </style>
    <!-- ========== 搜索框样式结束 ========== -->
</head>
<body>

    <!-- ========== 搜索框开始（整段可删） ========== -->
    <div class="search-tip">
        温馨提示：本工具仅为快捷跳转入口，搜索页面将会跳转至必应官网；关键词会自动添加英文双引号进行精确搜索，仅供个人自用，不用于商业用途
    </div>

    <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="输入搜索关键词">
        <button id="searchBtn">搜索</button>
    </div>

    <script>
        (function() {
            var inp = document.getElementById('searchInput');
            var btn = document.getElementById('searchBtn');
            function search() {
                var key = inp.value.trim();
                if (!key) return;
                window.open('https://cn.bing.com/search?q="' + key + '"');
            }
            btn.onclick = search;
            inp.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') search();
            });
        })();
    </script>
    <!-- ========== 搜索框结束 ========== -->


        <!-- 页脚 -->
    <br/><br/><br/><br/>
    <hr/>
    <link rel="stylesheet" href="/a/js/xhx.css">
    <link rel="stylesheet" href="/a/js/h.css">
    <script src="/a/js/ico.js"></script>
    <script src="/a/js/yj2.js"></script>

</body>
</html>
