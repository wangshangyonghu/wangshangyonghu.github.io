<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 引用外css和js -->
<link rel="stylesheet" href="/a/js/bj.css">
    <title>铆钉帽子材料长度计算器@网上用户</title>
    <meta name="keywords" content="网上用户,铆钉帽子材料长度计算器">
    <meta name="description" content="网上用户专属内容介绍:铆钉帽子材料长度计算器">
    <style type="text/css">
        A {
            TEXT-DECORATION: none;
            font-weight: bold;
            font-size: 12px;
        }
        .calculator-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 10px;
            box-sizing: border-box;
        }
        .item-line{
            margin:6px 0;
            display:flex;
            align-items:center;
            gap:6px;
        }
        .label-text{
            font-size:18px;
            white-space:nowrap;
        }
        input[type="number"] {
            flex:1;
            height: 50px;
            margin: 2px 0;
            padding: 0 10px;
            font-size: 18px;
            box-sizing: border-box;
        }
        #steps {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
            font-size: 16px;
            line-height: 1.6;
        }
        button {
            font-size: 52px;
            margin: 20px 0;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width:100%;
            box-sizing: border-box;
        }
        button:hover {
            background-color: #45a049;
        }
        h1 {
            color: #333;
            text-align:center;
            margin:2px 0;
        }
    </style>
</head>
<body>
    <h1><a href="../y/18.html" target="_blank">铆钉帽子材料长度计算器</a></h1>
<center>
    <div class="calculator-container">
        <div class="item-line">
            <span class="label-text">帽径:</span>
            <input type="number" id="num1" oninput="calculate()" placeholder="输入帽经:(毫米)" onkeydown="nextInput(event,'num2')" />
        </div>
        <div class="item-line">
            <span class="label-text">帽厚:</span>
            <input type="number" id="num2" oninput="calculate()" placeholder="输入帽厚:(毫米)" onkeydown="nextInput(event,'num3')"/>
        </div>
        <div class="item-line">
            <span class="label-text">线径:</span>
            <input type="number" id="num3" oninput="calculate()" placeholder="输入原材料线径:(毫米)" onkeydown="nextInput(event,'num1')" />
        </div>
        <div class="item-line">
            <span class="label-text">线长:</span>
            <input type="number" id="nums" style="font-size: 18px;" readonly placeholder="自动计算线长:(毫米)"/>
        </div>
        <br/><br/>
        <button onclick="resetInput()">清零</button>
        <div id="steps"></div>
    </div>
</center>
<script>
//回车跳到下一个输入框，最后一个回车回到第一个num1
function nextInput(e,targetId){
    if(e.key === 'Enter'){
        e.preventDefault();
        document.getElementById(targetId).focus();
    }
}
// 页面加载时读取本地缓存回填输入框
window.onload = function(){
    const cache1 = localStorage.getItem('rivet_num1');
    const cache2 = localStorage.getItem('rivet_num2');
    const cache3 = localStorage.getItem('rivet_num3');
    if(cache1) document.getElementById("num1").value = cache1;
    if(cache2) document.getElementById("num2").value = cache2;
    if(cache3) document.getElementById("num3").value = cache3;
    calculate();
}
function calculate() {
    // 空输入不转为0，用null判断
    var capDiameter = document.getElementById("num1").value ? parseFloat(document.getElementById("num1").value) : null;
    var capThickness = document.getElementById("num2").value ? parseFloat(document.getElementById("num2").value) : null;
    var wireDiameter = document.getElementById("num3").value ? parseFloat(document.getElementById("num3").value) : null;
    var stepsElement = document.getElementById("steps");
    var resultElement = document.getElementById("nums");
    // 保存缓存，有值才保存
    if(capDiameter !== null) localStorage.setItem('rivet_num1', capDiameter);
    else localStorage.removeItem('rivet_num1');
    if(capThickness !== null) localStorage.setItem('rivet_num2', capThickness);
    else localStorage.removeItem('rivet_num2');
    if(wireDiameter !== null) localStorage.setItem('rivet_num3', wireDiameter);
    else localStorage.removeItem('rivet_num3');
    
    // 清空结果和步骤
    resultElement.value = "";
    stepsElement.innerHTML = "";
    
    // 全部三个都有数值才计算
    if (capDiameter !== null && capThickness !== null && wireDiameter !== null && capDiameter > 0 && capThickness > 0 && wireDiameter > 0) {
        // 计算帽体积 = π × (帽经/2)² × 帽厚
        var radius = capDiameter / 2;
        var capVolume = Math.PI * Math.pow(radius, 2) * capThickness;
        
        // 计算线横截面积 = π × (线径/2)²
        var wireRadius = wireDiameter / 2;
        var wireArea = Math.PI * Math.pow(wireRadius, 2);
        
        // 计算线长 = 帽体积 / 线横截面积
        var wireLength = capVolume / wireArea;
        
        // 显示结果，保留两位小数
        resultElement.value = wireLength.toFixed(2);
        
        // 显示详细计算步骤
        stepsElement.innerHTML = `
            <h3>计算步骤：</h3>
            <p>1. 计算帽子半径：帽径 ÷ 2 = ${capDiameter} ÷ 2 = ${radius.toFixed(2)} 毫米</p>
            <p>2. 计算帽子体积：π × (半径)² × 帽厚 = 3.1416 × (${radius.toFixed(2)})² × ${capThickness} ≈ ${capVolume.toFixed(2)} 立方毫米</p>
            <p>3. 计算线材半径：线径 ÷ 2 = ${wireDiameter} ÷ 2 = ${wireRadius.toFixed(2)} 毫米</p>
            <p>4. 计算线材横截面积：π × (线材半径)² = 3.1416 × (${wireRadius.toFixed(2)})² ≈ ${wireArea.toFixed(2)} 平方毫米</p>
            <p>5. 计算所需线材长度：帽子体积 ÷ 线材横截面积 = ${capVolume.toFixed(2)} ÷ ${wireArea.toFixed(2)} ≈ ${wireLength.toFixed(2)} 毫米</p>
        `;
    }
}
// 清零功能
function resetInput() {
    document.getElementById("num1").value = "";
    document.getElementById("num2").value = "";
    document.getElementById("num3").value = "";
    document.getElementById("nums").value = "";
    document.getElementById("steps").innerHTML = "";
    // 清空本地缓存数据
    localStorage.removeItem('rivet_num1');
    localStorage.removeItem('rivet_num2');
    localStorage.removeItem('rivet_num3');
}
</script>
</body>
</html>
