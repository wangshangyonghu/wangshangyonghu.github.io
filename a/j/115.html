<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>年龄计算器</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f8f9fa;
    margin: 0;
    padding: 20px;
  }
  .container {
    max-width: 600px;
    margin: 0 auto;
    background: #fff;
    padding: 24px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  h2 { color: #333; margin: 0 0 4px 0; font-size: 22px; }
  .subtitle { color: #999; font-size: 14px; margin-bottom: 20px; }
  .row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }
  .row label {
    width: 80px;
    color: #555;
    font-size: 14px;
    flex-shrink: 0;
  }
  .row input {
    width: 80px;
    padding: 6px 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
  }
  .row input:focus { border-color: #4caf50; }
  .row input[name="month"], .row input[name="day"] { width: 60px; }
  .row span { color: #666; font-size: 14px; }
  .btn {
    padding: 6px 16px;
    background: #fff;
    border: 1px solid #4caf50;
    color: #4caf50;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    transition: all .2s;
  }
  .btn:hover { background: #4caf50; color: #fff; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    margin-top: 4px;
  }
  td {
    border: 1px solid #e0e0e0;
    padding: 10px 12px;
  }
  td:first-child {
    background: #f5f5f5;
    width: 160px;
    color: #555;
  }
  td:last-child { color: #333; }
  .note {
    margin-top: 24px;
    color: #666;
    font-size: 13px;
    line-height: 1.8;
  }
  .note h4 { color: #333; margin: 0 0 8px 0; }
  .note p { margin: 0; }
</style>
<base target="_blank">
</head>
<body>
<div class="container">
  <h2>年龄计算器</h2>
  <p class="subtitle">根据出生日期计算年龄、生肖和星座。</p>

  <div class="row">
    <label>公历日期：</label>
    <input id="gy" type="number" placeholder="年">
    <span>年</span>
    <input id="gm" type="number" placeholder="月" name="month">
    <span>月</span>
    <input id="gd" type="number" placeholder="日" name="day">
    <span>日</span>
    <button class="btn" onclick="calcSolar()">查询</button>
  </div>

  <div class="row">
    <label>农历日期：</label>
    <input id="ny" type="number" placeholder="年">
    <span>年</span>
    <input id="nm" type="number" placeholder="月" name="month">
    <span>月</span>
    <input id="nd" type="number" placeholder="日" name="day">
    <span>日</span>
    <button class="btn" onclick="calcLunar()">查询</button>
  </div>

  <table id="result" style="display:none;">
    <tr><td>周岁</td><td id="r-age"></td></tr>
    <tr><td>虚岁</td><td id="r-virtual"></td></tr>
    <tr><td>生肖</td><td id="r-zodiac"></td></tr>
    <tr><td>星座</td><td id="r-constellation"></td></tr>
    <tr><td>公历出生日期</td><td id="r-solar"></td></tr>
    <tr><td>农历出生日期</td><td id="r-lunar"></td></tr>
    <tr><td>下次公历生日</td><td id="r-next-solar"></td></tr>
    <tr><td>下次农历生日的公历日期</td><td id="r-next-lunar"></td></tr>
    <tr><td>生活天数</td><td id="r-days"></td></tr>
  </table>

  <div class="note">
    <h4>说明</h4>
    <p>仅供参考,有时候会算错</p>
    <p>周岁计算方法：每过一个生日就长一岁。</p>
    <p>虚岁计算方法：出生时为一岁，每过一个春节就长一岁。</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.2/lunar.min.js"></script>
<script>
const animals = ["猴","鸡","狗","猪","鼠","牛","虎","兔","龙","蛇","马","羊"];
const cnMonths = ["正","二","三","四","五","六","七","八","九","十","冬","腊"];
const cnNums = ["","一","二","三","四","五","六","七","八","九","十"];

function getConstellation(m, d) {
  const s = "魔羯水瓶双鱼白羊金牛双子巨蟹狮子处女天秤天蝎射手魔羯";
  const arr = [20,19,21,21,21,22,23,23,23,23,22,22];
  return s.substr(m*2 - (d < arr[m-1] ? 2 : 0), 2) + "座";
}
function cnMonth(m) {
  if (m <= 10) return cnMonths[m-1] + "月";
  if (m === 11) return "冬月";
  return "腊月";
}
function cnDay(d) {
  if (d <= 10) return "初" + cnNums[d];
  if (d < 20) return "十" + cnNums[d-10];
  if (d === 20) return "二十";
  if (d < 30) return "廿" + cnNums[d-20];
  return "三十";
}
function formatDate(d) {
  const week = ["日","一","二","三","四","五","六"];
  return d.getFullYear() + "年" + (d.getMonth()+1) + "月" + d.getDate() + "日，星期" + week[d.getDay()];
}
function daysBetween(a, b) {
  return Math.floor((b - a) / (1000*60*60*24));
}

function calcSolar() {
  const y = parseInt(document.getElementById("gy").value);
  const m = parseInt(document.getElementById("gm").value);
  const d = parseInt(document.getElementById("gd").value);
  if (!y || !m || !d) { alert("请输入完整的公历日期"); return; }
  const birth = new Date(y, m-1, d);
  if (birth.getFullYear() !== y || birth.getMonth() !== m-1 || birth.getDate() !== d) { alert("日期不合法"); return; }

  const today = new Date(); today.setHours(0,0,0,0);
  const lunar = Lunar.fromDate(birth);
  const ly = lunar.getYear(), lm = lunar.getMonth(), ld = lunar.getDay();
  const lYearGanZhi = lunar.getYearInGanZhi();
  const lMonthGanZhi = lunar.getMonthInGanZhi();
  const lDayGanZhi = lunar.getDayInGanZhi();

  let age = today.getFullYear() - y;
  const thisBirth = new Date(today.getFullYear(), m-1, d);
  if (today < thisBirth) age--;
  if (age < 0) age = 0;

  const lunarToday = Lunar.fromDate(today);
  let virtualAge = lunarToday.getYear() - ly + 1;

  const zodiac = animals[ly % 12];
  const constellation = getConstellation(m, d);

  let nextSolar = new Date(today.getFullYear(), m-1, d);
  if (nextSolar <= today) nextSolar.setFullYear(today.getFullYear() + 1);
  const solarDiff = daysBetween(today, nextSolar);

  let nextLunarYear = today.getFullYear();
  let nextLunar = Lunar.fromYmd(nextLunarYear, lm, ld);
  let nextLunarSolar = nextLunar.getSolar();
  let nextLunarDate = new Date(nextLunarSolar.getYear(), nextLunarSolar.getMonth()-1, nextLunarSolar.getDay());
  if (nextLunarDate <= today) {
    nextLunarYear++;
    nextLunar = Lunar.fromYmd(nextLunarYear, lm, ld);
    nextLunarSolar = nextLunar.getSolar();
    nextLunarDate = new Date(nextLunarSolar.getYear(), nextLunarSolar.getMonth()-1, nextLunarSolar.getDay());
  }
  const lunarDiff = daysBetween(today, nextLunarDate);
  const lived = daysBetween(birth, today);

  document.getElementById("r-age").textContent = age;
  document.getElementById("r-virtual").textContent = virtualAge;
  document.getElementById("r-zodiac").textContent = zodiac;
  document.getElementById("r-constellation").textContent = constellation;
  document.getElementById("r-solar").textContent = y + "年" + m + "月" + d + "日";
  document.getElementById("r-lunar").textContent = ly + "年" + cnMonth(lm) + cnDay(ld) + "（" + lYearGanZhi + "年 " + lMonthGanZhi + "月 " + lDayGanZhi + "日）";
  document.getElementById("r-next-solar").textContent = formatDate(nextSolar) + "，距离今天还有 " + solarDiff + " 天";
  document.getElementById("r-next-lunar").textContent = formatDate(nextLunarDate) + "，距离今天还有 " + lunarDiff + " 天";
  document.getElementById("r-days").textContent = "您在这个世界上生活了：" + lived + " 天";
  document.getElementById("result").style.display = "table";
}

function calcLunar() {
  const y = parseInt(document.getElementById("ny").value);
  const m = parseInt(document.getElementById("nm").value);
  const d = parseInt(document.getElementById("nd").value);
  if (!y || !m || !d) { alert("请输入完整的农历日期"); return; }
  try {
    const lunar = Lunar.fromYmd(y, m, d);
    const solar = lunar.getSolar();
    document.getElementById("gy").value = solar.getYear();
    document.getElementById("gm").value = solar.getMonth();
    document.getElementById("gd").value = solar.getDay();
    calcSolar();
  } catch(e) { alert("农历日期不合法"); }
}
</script>
</body>
</html>
