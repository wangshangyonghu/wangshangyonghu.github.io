公平村社山里小公园（把水公王宫旁）兴建活动室。
（一）；二零二五年四月十六日，由本村热心人仕（张吉友，陈浪华，张乐贤，陈井雄，张乃运，陈丽华，陈运良，陈桂芳，陈中权，陈贵良，陈汉南，张维今，张仁添，张育南，）到现场勘察设计，设计为二层滴水面积为85平方，兴建计款是255平方乘660元，共计为168300元。（不含装修，门，窗），兴建工程时间定在农历二零二五年四月二十八日，吉日良时，兴工大吉。工程由陈运良承包。

凡乐捐三仟元（含三仟元）以上列合家单碑。
凡乐捐一仟元（含一仟）以上列二户合家碑。
凡乐捐五百元（含五百元）以上列夫妻大碑。
凡乐捐二百元（含二百元）以上列单人大碑。
凡乐捐二百元以下的红榜公布。（注:捐款方式:可以多次捐款，直到列碑刻字前）。
（四）经济管理方式:付一仟元以上的金额要二名理事人员签名。
