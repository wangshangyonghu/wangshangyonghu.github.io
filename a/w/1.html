<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一年级反义词对子歌</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        body{
            background:#f8fef8;
            padding:30px 20px;
        }
        .box{
            max-width:700px;
            margin:0 auto;
            background:#ffffff;
            border-radius:16px;
            padding:35px;
            box-shadow:0 2px 10px #ddeedd;
        }
        h1{
            text-align:center;
            color:#d63031;
            margin-bottom:30px;
            font-size:28px;
        }
        p{
            font-size:22px;
            line-height:2.2;
            color:#222;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>反义词对子歌</h1>
        <p>
上对下，小对大。前对后，左对右。<br>
多对少，老对少。来对去，男对女。<br>
黑对白，里对外。高对低，粗对细。<br>
远对近，古对今。明对暗，早对晚。<br>
有对无，出对入。宽对窄，买对卖。<br>
南对北，首对尾。西对东，始对终。<br>
干对湿，公对私。美对丑，薄对厚。<br>
咸对淡，甘对甜。天对地，稠对稀。<br>
旧对新，晴对阴。浮对沉，假对真。<br>
强对弱，对对错。开对关，硬对软。<br>
冷对暖，热对凉。胖对瘦，忙对闲。<br>
快对慢，重对轻。笑对哭，好对坏。<br>
深对浅，密对疏。荣对辱，动对静。<br>
贫对富，输对赢。长对短，弯对直。
        </p>
    </div>
</body>
