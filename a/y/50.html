<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>点击写字+手写黑板 @网上用户</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;}

/* 顶部工具栏：强制单行，缩小按钮，不换行 */
.tool-bar{
  position:fixed;
  top:8px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:4px;
  z-index:999;
  background:rgba(30,30,30,0.5);
  padding:4px 8px;
  border-radius:99px;
  align-items:center;
  flex-wrap:nowrap;
  max-width:calc(100% - 12px);
}
.tool-btn{
  width:24px;
  height:24px;
  border-radius:50%;
  cursor:pointer;
  border:1px solid #fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:bold;
  user-select:none;
  color:#000;
  flex:0 0 auto;
}
.color-circle{
  width:18px;
  height:18px;
  border-radius:50%;
  cursor:pointer;
  border:1px solid #fff;
  flex:0 0 auto;
}
.write-btn{ background:#0b0; color:#fff; }
.draw-btn{ background:#08f; color:#fff; }
.line-btn{ background:#f90; color:#fff; }
.eraser-btn{ background:#ddd; color:#000; }
.clear-btn{ background:#f44; color:#fff; }
.active{ box-shadow:0 0 0 2px #ff0; }

/* 模式提示条 */
#hint{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  z-index:999;
  background:rgba(0,0,0,0.72);
  color:#fff;
  font-size:12px;
  line-height:1;
  padding:7px 12px;
  border-radius:99px;
  opacity:0;
  transition:opacity .2s;
  pointer-events:none;
  white-space:nowrap;
}

/* 手写画布 */
#drawCanvas{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  z-index:1;
  touch-action:none;
}

/* 直线预览层（只显示拖动中的预览线，不干扰点击） */
#lineCanvas{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  z-index:3;
  pointer-events:none;
  touch-action:none;
}

/* 文字输入层 */
.text-item{
  position:absolute;
  background:transparent;
  border:none;
  font-size:24px;
  font-weight:bold;
  outline:none;
  font-family:unset;
  color:#fff;
  z-index:2;
  white-space:pre-wrap;
  word-break:break-all;
  max-width:calc(100vw - 16px);
}
</style>
</head>
<body>

<div class="tool-bar">
  <div class="tool-btn write-btn" id="writeBtn">字</div>
  <div class="tool-btn draw-btn" id="drawBtn">手</div>
  <div class="tool-btn line-btn" id="lineBtn">线</div>
  <div class="color-circle" style="background:#000" data-color="#000"></div>
  <div class="color-circle" style="background:#fff" data-color="#fff"></div>
  <div class="color-circle" style="background:#ff0" data-color="#ff0"></div>
  <div class="color-circle" style="background:#00f" data-color="#00f"></div>
  <div class="color-circle" style="background:#f00" data-color="#f00"></div>
  <div class="color-circle" style="background:#0f0" data-color="#0f0"></div>
  <div class="tool-btn eraser-btn" id="eraserBtn">擦</div>
  <div class="tool-btn clear-btn" id="clearBtn">清</div>
</div>

<div id="hint">拖动=直线　点两下=点对点直线</div>

<canvas id="drawCanvas"></canvas>
<canvas id="lineCanvas"></canvas>


<script>
let currentColor = "#fff";
let mode;
const storageKey = "blackboardTextData";

// 判断设备：手机触屏默认手写draw；电脑非触屏默认打字write
function isMobileTouch(){
  return ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
}
if(isMobileTouch()){
  mode = "draw";
}else{
  mode = "write";
}

/* ========== 模式提示条 ========== */
const hintEl = document.getElementById("hint");
let hintTimer = null;
function showHint(text){
  hintEl.textContent = text;
  hintEl.style.opacity = "1";
  clearTimeout(hintTimer);
  hintTimer = setTimeout(function(){ hintEl.style.opacity = "0"; }, 2200);
}

/* ========== 画布 ========== */
const canvas = document.getElementById("drawCanvas");
const ctx = canvas.getContext("2d");
const lineCanvas = document.getElementById("lineCanvas");
const lctx = lineCanvas.getContext("2d");
let drawing = false;
let lastX = 0, lastY = 0;
let lineStart = null;   // 直线的起点，null 表示没在画直线

// 线宽、橡皮擦大小（橡皮擦改小了）
const PEN_WIDTH = 6;
const ERASE_SIZE = 16;

// 获取坐标：核心修复，把屏幕client坐标转为canvas内部坐标
function getCanvasPos(e){
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top) * scaleY
  }
}

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  lineCanvas.width = window.innerWidth;
  lineCanvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

function startDraw(e){
  const p = getCanvasPos(e);
  drawing = true;
  lastX = p.x;
  lastY = p.y;
  // 点一下也留一个点
  ctx.beginPath();
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = currentColor;
  ctx.lineWidth = PEN_WIDTH;
  ctx.moveTo(p.x, p.y);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
}
function moveDraw(e){
  if(!drawing) return;
  const p = getCanvasPos(e);
  ctx.beginPath();
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = currentColor;
  ctx.lineWidth = PEN_WIDTH;
  ctx.moveTo(lastX, lastY);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
  lastX = p.x;
  lastY = p.y;
}
function endDraw(){
  drawing = false;
}

/* ========== 直线 ==========
   两种用法：
   1）按住拖动 → 松手就是一条直线（拖动时能看到预览）
   2）点一下定起点（出现小圆点），再点第二下 → 点对点画直线
*/
let lineDragging = false;   // 是否正在按住拖
let lineAnchor = null;      // 点对点模式下的第一个点
let linePressPos = null;    // 这次按下的位置，用来判断是“拖”还是“点”

function previewLine(a, b){
  lctx.clearRect(0, 0, lineCanvas.width, lineCanvas.height);
  lctx.beginPath();
  lctx.lineCap = "round";
  lctx.lineJoin = "round";
  lctx.strokeStyle = currentColor;
  lctx.lineWidth = PEN_WIDTH;
  lctx.moveTo(a.x, a.y);
  lctx.lineTo(b.x, b.y);
  lctx.stroke();
  // 起点画个小圆点，提醒第二下点哪里
  lctx.beginPath();
  lctx.arc(a.x, a.y, 5, 0, Math.PI * 2);
  lctx.fillStyle = currentColor;
  lctx.fill();
  lctx.beginPath();
  lctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
  lctx.fill();
}
function clearPreview(){
  lctx.clearRect(0, 0, lineCanvas.width, lineCanvas.height);
}
function drawLine(a, b){
  ctx.beginPath();
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = currentColor;
  ctx.lineWidth = PEN_WIDTH;
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.stroke();
}

// 按下
function startLine(e){
  const p = getCanvasPos(e);
  if(lineAnchor){
    // 已经有第一点 → 这一下就是终点，直接画成直线
    drawLine(lineAnchor, p);
    lineAnchor = null;
    linePressPos = null;
    clearPreview();
    return;
  }
  lineDragging = true;
  lineStart = p;
  linePressPos = p;
  previewLine(p, p);
}

// 移动（按着拖 或 已定起点后移动预览）
function moveLine(e){
  const p = getCanvasPos(e);
  if(lineDragging && lineStart){
    previewLine(lineStart, p);
  }else if(lineAnchor){
    previewLine(lineAnchor, p);
  }
}

// 松手
function finishLine(e){
  if(!lineDragging) return;
  lineDragging = false;
  const p = getCanvasPos(e);
  const from = lineStart;
  lineStart = null;
  if(!from) return;

  const dist = Math.hypot(p.x - from.x, p.y - from.y);
  if(dist < 6){
    // 只是点了一下，没拖 → 把它当点对点的第一个点，等第二下
    lineAnchor = from;
    previewLine(from, from);
    showHint("第一点已定，再点一下就是终点");
  }else{
    drawLine(from, p);
    lineAnchor = null;
    clearPreview();
  }
  linePressPos = null;
}

function cancelLine(){
  lineDragging = false;
  lineStart = null;
  lineAnchor = null;
  linePressPos = null;
  clearPreview();
}

/* ========== PointerEvents ========== */
function enableDrawEvents(){
  canvas.style.pointerEvents = "auto";
  canvas.addEventListener("pointerdown", onPointerDown);
  canvas.addEventListener("pointermove", onPointerMove);
  canvas.addEventListener("pointerup", onPointerUp);
  canvas.addEventListener("pointercancel", onPointerCancel);
}
function disableDrawEvents(){
  canvas.style.pointerEvents = "none";
  canvas.removeEventListener("pointerdown", onPointerDown);
  canvas.removeEventListener("pointermove", onPointerMove);
  canvas.removeEventListener("pointerup", onPointerUp);
  canvas.removeEventListener("pointercancel", onPointerCancel);
}

function onPointerDown(e){
  if(mode !== "draw" && mode !== "line") return;
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  if(mode === "draw"){ startDraw(e); }
  else { startLine(e); }
}
function onPointerMove(e){
  if(mode !== "draw" && mode !== "line") return;
  e.preventDefault();
  if(mode === "draw"){ if(drawing) moveDraw(e); }
  else { moveLine(e); }
}
function onPointerUp(e){
  if(mode === "draw"){ endDraw(); }
  else if(mode === "line"){ finishLine(e); }
}
function onPointerCancel(){
  endDraw();
  cancelLine();
}

/* ========== 文字系统 ========== */
function saveData(){
  const list = [];
  document.querySelectorAll(".text-item").forEach(div=>{
    list.push({
      x: parseFloat(div.style.left),
      y: parseFloat(div.style.top),
      color: div.style.color,
      text: div.innerText
    });
  });
  localStorage.setItem(storageKey, JSON.stringify(list));
}

/* 让文字可以用鼠标拖动位置 */
function makeDraggable(div){
  let startX=0,startY=0,startLeft=0,startTop=0,drag=false,moved=false;
  div.addEventListener("pointerdown", function(e){
    if(mode!=="write") return;
    startX=e.clientX; startY=e.clientY;
    startLeft=parseFloat(div.style.left)||0;
    startTop=parseFloat(div.style.top)||0;
    drag=true; moved=false;
    div.contentEditable=false;
    div.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  div.addEventListener("pointermove", function(e){
    if(!drag) return;
    let dx=e.clientX-startX, dy=e.clientY-startY;
    if(Math.abs(dx)>3||Math.abs(dy)>3) moved=true;
    div.style.left=(startLeft+dx)+"px";
    div.style.top=(startTop+dy)+"px";
  });
  function endDrag(e){
    if(!drag) return;
    drag=false;
    div.contentEditable=true;
    if(moved){ saveData(); }else{ div.focus(); }
  }
  div.addEventListener("pointerup", endDrag);
  div.addEventListener("pointercancel", endDrag);
}

function loadData(){
  const raw = localStorage.getItem(storageKey);
  if(!raw) return;
  const list = JSON.parse(raw);
  list.forEach(item=>{
    if(!item.text) return;
    if(item.x > window.innerWidth - 20) item.x = window.innerWidth - 20;
    let div = document.createElement("div");
    div.className = "text-item";
    div.contentEditable = true;
    div.style.left = item.x + "px";
    div.style.top = item.y + "px";
    div.style.color = item.color;
    div.innerText = item.text;
    document.body.appendChild(div);
    makeDraggable(div);
    div.addEventListener("input", saveData);
    div.addEventListener("blur", function(){
      if(this.innerText.trim() === "") this.remove();
      saveData();
    });
  });
}
loadData();

/* ========== 工具栏切换 ========== */
const writeBtn = document.getElementById("writeBtn");
const drawBtn = document.getElementById("drawBtn");
const lineBtn = document.getElementById("lineBtn");
const eraserBtn = document.getElementById("eraserBtn");
const clearBtn = document.getElementById("clearBtn");

function setMode(newMode){
  mode = newMode;
  writeBtn.classList.remove("active");
  drawBtn.classList.remove("active");
  lineBtn.classList.remove("active");
  eraserBtn.classList.remove("active");
  cancelLine();

  if(mode === "write"){
    writeBtn.classList.add("active");
    disableDrawEvents();
  }
  if(mode === "draw"){
    drawBtn.classList.add("active");
    enableDrawEvents();
  }
  if(mode === "line"){
    lineBtn.classList.add("active");
    enableDrawEvents();
    showHint("直线：拖动一笔画完　或　点两下定两点");
  }
  if(mode === "eraser"){
    eraserBtn.classList.add("active");
    disableDrawEvents();
    showHint("橡皮擦已调小，按住拖动可以连续擦");
  }
}
setMode(mode);

writeBtn.addEventListener("click", ()=>setMode("write"));
drawBtn.addEventListener("click", ()=>setMode("draw"));
lineBtn.addEventListener("click", ()=>setMode("line"));

/* 颜色切换 */
document.querySelectorAll(".color-circle").forEach(el=>{
  el.addEventListener("click", function(){
    currentColor = this.dataset.color;
  });
});

/* 橡皮擦：小尺寸 16px，按住还能拖着连续擦 */
let erasing = false;
let lastEraseX = null, lastEraseY = null;

function eraseDot(clientX, clientY){
  const p = getCanvasPos({clientX, clientY});
  const half = ERASE_SIZE / 2;
  ctx.clearRect(p.x - half, p.y - half, ERASE_SIZE, ERASE_SIZE);

  // 擦到文字就一并删掉（判定范围跟着橡皮擦走，不夸张）
  document.querySelectorAll(".text-item").forEach(item=>{
    const r = item.getBoundingClientRect();
    if(
      clientX >= r.left - half &&
      clientX <= r.right + half &&
      clientY >= r.top - half &&
      clientY <= r.bottom + half
    ){
      item.remove();
      saveData();
    }
  });
}

function eraseAt(clientX, clientY){
  if(lastEraseX !== null){
    // 拖快了中间会留缺口，按间距补点
    const dist = Math.hypot(clientX - lastEraseX, clientY - lastEraseY);
    const step = ERASE_SIZE / 3;
    const n = Math.floor(dist / step);
    for(let i = 1; i <= n; i++){
      const t = i / (n + 1);
      eraseDot(lastEraseX + (clientX - lastEraseX) * t, lastEraseY + (clientY - lastEraseY) * t);
    }
  }
  eraseDot(clientX, clientY);
  lastEraseX = clientX;
  lastEraseY = clientY;
}

eraserBtn.addEventListener("click", function(){
  if(mode === "eraser"){
    setMode(isMobileTouch() ? "draw" : "write");
  }else{
    setMode("eraser");
  }
});

document.body.addEventListener("pointerdown", function(e){
  if(mode !== "eraser") return;
  if(e.target.classList.contains("tool-btn") || e.target.classList.contains("color-circle")) return;
  erasing = true;
  lastEraseX = null;
  lastEraseY = null;
  eraseAt(e.clientX, e.clientY);
});
document.body.addEventListener("pointermove", function(e){
  if(mode !== "eraser" || !erasing) return;
  eraseAt(e.clientX, e.clientY);
});
document.body.addEventListener("pointerup", function(){ erasing = false; lastEraseX = null; lastEraseY = null; });
document.body.addEventListener("pointercancel", function(){ erasing = false; lastEraseX = null; lastEraseY = null; });

/* 清屏按钮 */
clearBtn.onclick = function(){
  document.querySelectorAll(".text-item").forEach(item=>item.remove());
  localStorage.removeItem(storageKey);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  cancelLine();
};

/* 文字点击输入 */
document.body.addEventListener("click", function(e){
  if(mode !== "write") return;
  if(e.target.classList.contains("text-item") || e.target.classList.contains("tool-btn") || e.target.classList.contains("color-circle")) return;

  let clickX = e.clientX;
  const maxLeft = window.innerWidth - 20;
  if(clickX > maxLeft) clickX = maxLeft;

  let div = document.createElement("div");
  div.className = "text-item";
  div.contentEditable = true;
  div.style.left = clickX + "px";
  div.style.top = e.clientY + "px";
  div.style.color = currentColor;
  document.body.appendChild(div);
  makeDraggable(div);
  div.focus();

  div.addEventListener("input", saveData);
  div.addEventListener("blur", function(){
    if(this.innerText.trim() === "") this.remove();
    saveData();
  });
});
</script>
</body>
</html>
