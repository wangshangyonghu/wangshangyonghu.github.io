<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二维码生成工具@网上用户</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{padding:20px;max-width:600px;margin:0 auto;}
#textInput{width:100%;padding:12px;font-size:16px;border:1px solid #ccc;border-radius:6px;margin-bottom:12px;}
#btnGen{padding:10px 20px;background:#0066cc;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer;}
#btnDown{padding:10px 20px;background:#229955;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer;margin-left:8px;}
#qrcodeBox{margin-top:20px;text-align:center;}
canvas{border:1px solid #eee;}
</style>
</head>
<body>
<h3>二维码生成工具</h3>
<input id="textInput" placeholder="输入网址、文字内容">
<div>
<button id="btnGen">生成二维码</button>
<button id="btnDown">下载图片</button>
</div>
<div id="qrcodeBox"></div>
<script>
const input = document.getElementById('textInput');
const btnGen = document.getElementById('btnGen');
const btnDown = document.getElementById('btnDown');
const box = document.getElementById('qrcodeBox');
let qrCanvas = null;

btnGen.onclick = function(){
    box.innerHTML = '';
    let val = input.value.trim();
    if(!val){alert('请输入内容');return;}
    qrCanvas = document.createElement('canvas');
    QRCode.toCanvas(qrCanvas, val, {width:300}, function(error){
        if(error){
            console.error(error);
            alert('生成失败');
        }else{
            box.appendChild(qrCanvas);
        }
    });
}

btnDown.onclick = function(){
    if(!qrCanvas){alert('请先生成二维码');return;}
    let link = document.createElement('a');
    link.download = 'qrcode.png';
    link.href = qrCanvas.toDataURL('image/png');
    link.click();
}
</script>
</body>
</html>
