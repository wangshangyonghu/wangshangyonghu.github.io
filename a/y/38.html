<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字上下标转换器@网上用户</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            background: #f0f2f5;
            padding: 30px 15px;
        }
        .wrap {
            max-width: 480px;
            margin: 0 auto;
            background: #ffffff;
            padding: 26px;
            border-radius: 14px;
            box-shadow: 0 2px 14px rgba(0,0,0,0.08);
        }
        h3 {
            text-align: center;
            margin-bottom: 20px;
            color: #222;
        }
        #inputText {
            width: 100%;
            height: 110px;
            padding: 14px;
            font-size: 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
            resize: none;
            margin-bottom: 20px;
        }
        .item {
            margin-bottom: 18px;
        }
        .tip {
            font-size: 14px;
            color: #555;
            margin-bottom: 6px;
        }
        .result-box{
            display:flex;
            gap:10px;
            align-items:center;
        }
        .result {
            flex:1;
            padding: 14px;
            background-color: #f7f8fa;
            border-radius: 8px;
            font-size: 24px;
            word-break: break-all;
        }
        .copy-btn{
            padding:8px 14px;
            border:none;
            background:#4096ff;
            color:#fff;
            border-radius:6px;
            cursor:pointer;
            white-space:nowrap;
        }
    </style>
</head>
<body>
<div class="wrap">
    <h3>数字上下标转换器@网上用户</h3>
    <textarea id="inputText" placeholder="输入数字或混合字符"></textarea>

    <div class="item">
        <div class="tip">上标文本</div>
        <div class="result-box">
            <div class="result" id="supResult"></div>
            <button class="copy-btn" id="copySup">复制</button>
        </div>
    </div>
    <div class="item">
        <div class="tip">下标文本</div>
        <div class="result-box">
            <div class="result" id="subResult"></div>
            <button class="copy-btn" id="copySub">复制</button>
        </div>
    </div>
</div>

<script>
    const sup = ['⁰','¹','²','³','⁴','⁵','⁶','⁷','⁸','⁹'];
    const sub = ['₀','₁','₂','₃','₄','₅','₆','₇','₈','₉'];

    const inp = document.getElementById('inputText');
    const supDom = document.getElementById('supResult');
    const subDom = document.getElementById('subResult');
    const copySup = document.getElementById('copySup');
    const copySub = document.getElementById('copySub');

    let upText = "";
    let downText = "";

    function runConvert(text){
        upText = '';
        downText = '';
        for(let char of text){
            const num = parseInt(char);
            if(!isNaN(num)){
                upText += sup[num];
                downText += sub[num];
            }else{
                upText += char;
                downText += char;
            }
        }
        supDom.innerText = upText;
        subDom.innerText = downText;
    }
    inp.oninput = ()=> runConvert(inp.value);

    // 兼容版复制函数
    async function copyText(str){
        try{
            await navigator.clipboard.writeText(str);
            alert("复制成功");
        }catch (e){
            // 旧浏览器兼容方案
            const temp = document.createElement('textarea');
            temp.value = str;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand('copy');
            document.body.removeChild(temp);
            alert("复制成功");
        }
    }
    copySup.onclick = ()=> copyText(upText);
    copySub.onclick = ()=> copyText(downText);
</script>
</body>
</html>
